# Forward API requests to the backend container (Docker service name, not localhost).
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # /api/tasks... -> http://backend:5000/api/tasks...
    # (no URI after proxy_pass, so the original path is passed unchanged)
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Single-page app fallback: unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
