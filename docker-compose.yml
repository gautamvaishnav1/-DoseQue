# Compose project name (the folder name starts with "-", so set it explicitly)
name: doseque

services:
  mongodb:
    image: mongo:7
    container_name: doseque-mongodb
    restart: unless-stopped
    ports:
      # Host ports 27018/6380 avoid conflicts with other projects that may
      # already use 27017/6379. Published only on 127.0.0.1 so local dev can
      # use them, but they are not exposed to the network.
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db # named volume = data survives container restarts
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: doseque-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379" # 6380 avoids conflicts with other local Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    container_name: doseque-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      NODE_ENV: production
      # Docker service names instead of localhost!
      MONGODB_URI: mongodb://mongodb:27017/doseque
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # node is already in the image, so use its built-in fetch
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api # baked into the build; nginx proxies /api -> backend
    container_name: doseque-frontend
    restart: unless-stopped
    ports:
      - "5173:80" # open http://localhost:5173 (same URL as local dev)
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
